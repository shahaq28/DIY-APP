  <style>
    /* iOS Tap and smooth scrolling styles */

      -webkit-tap-highlight-color: transparent;
      user-select: none;

    input, textarea {
      user-select: text;
    }
    html {
      background-color: #f8fafc;
      height: 100%;
    }
    html.dark {
      background-color: #020617;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: inherit;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* iPhone / Safari Safe Area utilities */
    .pt-safe {
      padding-top: max(1rem, env(safe-area-inset-top, 0px));
    }
    .pb-safe {
      padding-bottom: max(0.75rem, env(safe-area-inset-bottom, 0px));
    }
    
    /* Custom Scrollbar for sleek UI */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(150, 150, 150, 0.2);
      border-radius: 99px;
    }
    
    /* Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.03); }
    }
    .animate-glow {
      animation: pulseGlow 2.5s infinite ease-in-out;
    }

    @keyframes confettiFall {
      0% { transform: translateY(-100%) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
    .animate-confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      animation: confettiFall 3s linear infinite;

  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen min-h-[100dvh] transition-colors duration-200 flex justify-center">

  <div id="root" class="w-full max-w-md min-h-screen min-h-[100dvh] flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const STORAGE_KEY = 'everyday_pwa_data_v4';

    // Dynamic Leveling Formula based on Exponential Scaling
    const getLevelInfo = (xp) => {
      let level = 1;
      let reqXp = 100;
      let totalXpAccumulated = 0;

      while (xp >= totalXpAccumulated + reqXp) {
        totalXpAccumulated += reqXp;
        level++;
        reqXp = Math.floor(100 * Math.pow(level, 1.22));
      }

      const currentLevelXp = xp - totalXpAccumulated;
      const progressPercent = Math.min(100, Math.max(0, (currentLevelXp / reqXp) * 100));

      // Titles & Ranks
      const titles = [
        { min: 1, title: 'Novice Explorer', badge: '🌱', color: 'from-slate-500 to-slate-700' },
        { min: 3, title: 'Consistent Striver', badge: '⚡', color: 'from-blue-500 to-indigo-600' },
        { min: 5, title: 'Adept Crusader', badge: '🔥', color: 'from-amber-500 to-orange-600' },
        { min: 8, title: 'Unstoppable Titan', badge: '🛡️', color: 'from-emerald-500 to-teal-700' },
        { min: 12, title: 'Master Virtuoso', badge: '👑', color: 'from-purple-600 to-indigo-800' },
        { min: 20, title: 'Mythic Legend', badge: '💎', color: 'from-rose-500 to-pink-700' }
      ];

      const currentTitleObj = [...titles].reverse().find(t => level >= t.min) || titles[0];

      return {
        level,
        currentLevelXp,
        reqXp,
        progressPercent,
        title: currentTitleObj.title,
        badge: currentTitleObj.badge,
        color: currentTitleObj.color
      };
    };

    // Pure Clean Slate generator with rich dynamic achievements
    const getCleanSlateData = () => JSON.parse(JSON.stringify({
      theme: 'dark',
      units: 'metric',
      streak: 1,
      lastActiveDate: new Date().toISOString().split('T')[0],
      xp: 0,
      waterGlassCount: 0,
      waterTarget: 8,
      sleep: { bedtime: '', wakeTime: '', quality: 0, duration: '0', history: [] },
      bodyStats: { weight: 0, weightGoal: 0, height: 0, bodyFat: 0, waist: 0, chest: 0, biceps: 0, history: [] },
      workouts: [],
      challenges: [
        { id: 'c1', title: 'Drink 8 glasses of water', xp: 60, done: false, category: 'daily' },
        { id: 'c2', title: 'Complete 30 min workout session', xp: 120, done: false, category: 'daily' },
        { id: 'c3', title: 'Log 8 hours of quality sleep', xp: 80, done: false, category: 'daily' },
        { id: 'c4', title: 'Reach 4 active workouts this week', xp: 300, done: false, category: 'weekly' },
        { id: 'c5', title: 'Perform 10 minutes of stretching', xp: 50, done: false, category: 'daily' }
      ],
      achievements: [
        { id: 'a1', title: 'Genesis Explorer', desc: 'Log your first daily activity or note', unlocked: false, claimed: false, rewardXp: 100, icon: '🚀', category: 'Starter', target: 1, current: 0 },
        { id: 'a2', title: 'Hydration Hero', desc: 'Reach daily water goal 5 times', unlocked: false, claimed: false, rewardXp: 200, icon: '💧', category: 'Wellness', target: 5, current: 0 },
        { id: 'a3', title: 'Iron Titan', desc: 'Accumulate over 10,000kg total volume', unlocked: false, claimed: false, rewardXp: 350, icon: '🏋️‍♂️', category: 'Fitness', target: 10000, current: 0 },
        { id: 'a4', title: 'Unstoppable Streak', desc: 'Maintain a 7-day active streak', unlocked: false, claimed: false, rewardXp: 500, icon: '🔥', category: 'Consistency', target: 7, current: 1 },
        { id: 'a5', title: 'Sleep Virtuoso', desc: 'Log sleep 3 days with 8+ hours', unlocked: false, claimed: false, rewardXp: 250, icon: '🌙', category: 'Wellness', target: 3, current: 0 },
        { id: 'a6', title: 'Workout Warrior', desc: 'Complete 5 fitness sessions', unlocked: false, claimed: false, rewardXp: 400, icon: '🏆', category: 'Fitness', target: 5, current: 0 },
        { id: 'a7', title: 'Goal Crusher', desc: 'Complete 10 daily or weekly challenges', unlocked: false, claimed: false, rewardXp: 300, icon: '🎯', category: 'Mastery', target: 10, current: 0 }
      ],
      dailyNotes: {}
    }));

    const getInitialData = () => getCleanSlateData();

    let audioCtx = null;
    const playSound = (type = 'pop') => {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'pop') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(350, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.08);
        } else if (type === 'success' || type === 'claim') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
          osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.09);
          osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.18);
          gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'levelup') {
          const notes = [440, 554.37, 659.25, 880];
          notes.forEach((freq, idx) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = 'sine';
            o.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.08);
            g.gain.setValueAtTime(0.2, audioCtx.currentTime + idx * 0.08);
            g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.08 + 0.35);
            o.connect(g);
            g.connect(audioCtx.destination);
            o.start(audioCtx.currentTime + idx * 0.08);
            o.stop(audioCtx.currentTime + idx * 0.08 + 0.35);
          });
        } else if (type === 'reset') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(400, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.2);
        }
      } catch (e) {}
    };

    function Icon({ name, classNames = "w-5 h-5" }) {
      const icons = {
        home: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />,
        dumbbell: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 7v10M20 7v10M8 5v14M16 5v14M8 12h8" />,
        stats: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />,
        target: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm0-6a10 10 0 100 20 10 10 0 000-20z" />,
        grid: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />,
        water: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 2.69l5.66 5.66a8 8 0 11-11.31 0z" />,
        moon: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />,
        sun: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />,
        plus: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" />,
        trash: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />,
        check: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" />,
        flame: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343a7.975 7.975 0 010 11.314z" />,
        calc: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" />,
        calendar: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />,
        trophy: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4a5 5 0 005 5h4a5 5 0 005-5V3M3 3h18M8 21h8m-4-4v4" />,
        settings: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />,
        arrowLeft: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />,
        clock: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />,
        note: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
      };

      return (
        <svg xmlns="http://www.w3.org/2000/svg" className={classNames} fill="none" viewBox="0 0 24 24" stroke="currentColor">
          {icons[name] || icons.grid}
        </svg>
      );
    }

    function App() {
      const [data, setData] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          return saved ? JSON.parse(saved) : getInitialData();
        } catch (e) {
          return getInitialData();
        }
      });

      const [activeTab, setActiveTab] = useState('home');
      const [subView, setSubView] = useState(null);
      const [showResetModal, setShowResetModal] = useState(false);
      const [levelUpModal, setLevelUpModal] = useState(null);
      const [toastMsg, setToastMsg] = useState('');

      const prevLevelRef = useRef(getLevelInfo(data.xp).level);

      // Persist state changes & sync dark mode + iOS theme-color meta tag
      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch (e) {}

        const isDark = data.theme === 'dark';
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }

        // Dynamically update iOS status bar & PWA theme color
        const themeColorMeta = document.getElementById('meta-theme-color');
        if (themeColorMeta) {
          themeColorMeta.setAttribute('content', isDark ? '#020617' : '#f8fafc');
        }
      }, [data]);

      // Level calculation info
      const levelInfo = useMemo(() => getLevelInfo(data.xp), [data.xp]);

      // Detect Level Ups
      useEffect(() => {
        if (levelInfo.level > prevLevelRef.current) {
          playSound('levelup');
          setLevelUpModal({
            newLevel: levelInfo.level,
            title: levelInfo.title,
            badge: levelInfo.badge
          });
        }
        prevLevelRef.current = levelInfo.level;
      }, [levelInfo.level]);

      // Streak XP Multiplier (e.g. 7 day streak gives 1.25x XP)
      const xpMultiplier = useMemo(() => {
        if (data.streak >= 14) return 1.5;
        if (data.streak >= 7) return 1.25;
        return 1.0;
      }, [data.streak]);

      // Dynamic Achievement Evaluation & Progress Updates
      useEffect(() => {
        setData(prev => {
          let hasChanges = false;
          const totalVol = prev.workouts.reduce((acc, w) => acc + w.volume, 0);
          const completedChallengesCount = prev.challenges.filter(c => c.done).length;
          const goodSleepDays = prev.sleep.history.filter(h => h.duration >= 8).length;

          const updatedAchievements = prev.achievements.map(a => {
            let currentVal = a.current || 0;

            if (a.id === 'a1') currentVal = (prev.workouts.length > 0 || prev.waterGlassCount > 0 || Object.keys(prev.dailyNotes).length > 0) ? 1 : 0;
            if (a.id === 'a2') currentVal = prev.waterGlassCount >= prev.waterTarget ? Math.min(a.target, (a.current || 0) + 1) : (a.current || 0);
            if (a.id === 'a3') currentVal = totalVol;
            if (a.id === 'a4') currentVal = prev.streak;
            if (a.id === 'a5') currentVal = goodSleepDays;
            if (a.id === 'a6') currentVal = prev.workouts.length;
            if (a.id === 'a7') currentVal = completedChallengesCount;

            const isNowUnlocked = currentVal >= a.target;

            if (currentVal !== a.current || (isNowUnlocked && !a.unlocked)) {
              hasChanges = true;
              return {
                ...a,
                current: currentVal,
                unlocked: isNowUnlocked || a.unlocked
              };
            }
            return a;
          });

          return hasChanges ? { ...prev, achievements: updatedAchievements } : prev;
        });
      }, [data.waterGlassCount, data.workouts, data.streak, data.dailyNotes, data.challenges, data.sleep.history]);

      const triggerToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 2500);
      };

      const toggleTheme = () => {
        playSound('pop');
        setData(prev => ({ ...prev, theme: prev.theme === 'dark' ? 'light' : 'dark' }));
      };

      const addXpWithMultiplier = (baseXp) => {
        const totalGained = Math.round(baseXp * xpMultiplier);
        setData(prev => ({ ...prev, xp: prev.xp + totalGained }));
        return totalGained;
      };

      const handleWaterAdd = (delta = 1) => {
        playSound('pop');
        let gained = 0;
        setData(prev => {
          const count = Math.max(0, prev.waterGlassCount + delta);
          const reachedTarget = count === prev.waterTarget && prev.waterGlassCount < prev.waterTarget;
          const baseXp = reachedTarget ? 60 : (delta > 0 ? 15 : 0);
          
          if (baseXp > 0) {
            gained = Math.round(baseXp * xpMultiplier);
            playSound('success');
          }
          return {
            ...prev,
            waterGlassCount: count,
            xp: prev.xp + gained
          };
        });
        if (delta > 0) triggerToast(`Hydration logged! (+${gained} XP)`);
      };

      const toggleChallenge = (id) => {
        playSound('pop');
        setData(prev => {
          let gainedXp = 0;
          const updated = prev.challenges.map(c => {
            if (c.id === id) {
              const nextDone = !c.done;
              const baseXp = nextDone ? c.xp : -c.xp;
              gainedXp = Math.round(baseXp * (nextDone ? xpMultiplier : 1));
              return { ...c, done: nextDone };
            }
            return c;
          });
          if (gainedXp > 0) playSound('success');
          return {
            ...prev,
            challenges: updated,
            xp: Math.max(0, prev.xp + gainedXp)
          };
        });
      };

      const handleClaimAchievement = (achId) => {
        playSound('claim');
        setData(prev => {
          let rewardGained = 0;
          const updated = prev.achievements.map(a => {
            if (a.id === achId && a.unlocked && !a.claimed) {
              rewardGained = a.rewardXp;
              return { ...a, claimed: true };
            }
            return a;
          });

          return {
            ...prev,
            achievements: updated,
            xp: prev.xp + rewardGained
          };
        });
        triggerToast(`Achievement Claimed! 🎉 (+ Bonus XP)`);
      };

      // Pristine clean slate reset handler
      const handleFactoryReset = () => {
        playSound('reset');
        try {
          localStorage.removeItem(STORAGE_KEY);
          localStorage.clear();
        } catch (e) {}
        
        const freshCleanData = getCleanSlateData();
        setData(freshCleanData);
        setShowResetModal(false);
        setActiveTab('home');
        setSubView(null);
        triggerToast('App reset to clean slate! XP, levels & achievements wiped.');
      };

      return (

    function FitnessView({ data, setData, addXpWithMultiplier, triggerToast }) {
      const [showNewModal, setShowNewModal] = useState(false);
      const [workoutName, setWorkoutName] = useState('Strength Workout');
      const [exerciseInput, setExerciseInput] = useState('');
      const [setsInput, setSetsInput] = useState('3');
      const [weightInput, setWeightInput] = useState('60');
      const [repsInput, setRepsInput] = useState('10');
      const [currentExercises, setCurrentExercises] = useState([]);
      const [restTimer, setRestTimer] = useState(0);

      useEffect(() => {
        let interval = null;
        if (restTimer > 0) {
          interval = setInterval(() => {
            setRestTimer(prev => {
              if (prev <= 1) {
                playSound('pop');
                triggerToast('Rest timer finished!');
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [restTimer]);

      const handleAddExercise = () => {
        if (!exerciseInput.trim()) return;
        playSound('pop');
        const numSets = parseInt(setsInput) || 3;
        const w = parseFloat(weightInput) || 0;
        const r = parseInt(repsInput) || 10;

        const setsArray = Array.from({ length: numSets }).map(() => ({ weight: w, reps: r }));

        setCurrentExercises(prev => [...prev, { name: exerciseInput.trim(), sets: setsArray }]);
        setExerciseInput('');
      };

      const handleSaveWorkout = () => {
        if (currentExercises.length === 0) return;
        playSound('success');

        let totalVol = 0;
        currentExercises.forEach(ex => {
          ex.sets.forEach(s => {
            totalVol += (s.weight * s.reps);
          });
        });

        const newWorkout = {
          id: 'w_' + Date.now(),
          name: workoutName,
          date: new Date().toISOString().split('T')[0],
          volume: Math.round(totalVol),
          exercises: currentExercises
        };

        const gained = addXpWithMultiplier(150);

        setData(prev => ({
          ...prev,
          workouts: [newWorkout, ...prev.workouts]
        }));

        setCurrentExercises([]);
        setShowNewModal(false);
        triggerToast(`Workout saved! (+${gained} XP)`);
      };

      return (
        <div class="space-y-4">
          
          <div class="p-5 rounded-3xl bg-gradient-to-r from-emerald-600 to-teal-700 text-white flex justify-between items-center shadow-lg shadow-emerald-500/20">
            <div>
              <span class="text-[10px] font-bold uppercase tracking-wider text-emerald-200">Fitness Studio</span>
              <h3 class="text-xl font-black mt-0.5">{data.workouts.length} Workouts Logged</h3>
              <p class="text-xs text-emerald-100 mt-1">Total Volume: {data.workouts.reduce((acc, w) => acc + w.volume, 0).toLocaleString()} kg</p>
            </div>
            <button 
              onClick={() => { playSound('pop'); setShowNewModal(true); }}
              class="px-4 py-2.5 bg-white text-emerald-800 rounded-2xl text-xs font-black shadow-md hover:scale-105 active:scale-95 transition-all flex items-center gap-1"
            >
              <Icon name="plus" classNames="w-4 h-4 stroke-[3]" /> Log New
            </button>
          </div>

          {restTimer > 0 && (
            <div class="p-3 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex justify-between items-center animate-pulse">
              <span class="text-xs font-bold text-amber-500 flex items-center gap-2">
                <Icon name="clock" classNames="w-4 h-4" /> Rest Timer Active: {restTimer}s
              </span>
              <button onClick={() => setRestTimer(0)} class="text-xs text-red-500 font-bold px-2 py-1">Skip</button>
            </div>
          )}

          <div class="space-y-3">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider px-1">Recent Sessions</h3>
            {data.workouts.map(w => (
              <div key={w.id} class="p-4 rounded-3xl bg-white dark:bg-slate-800/50 border border-slate-200/80 dark:border-slate-800 space-y-3 shadow-sm">
                <div class="flex justify-between items-start">
                  <div>
                    <h4 class="font-black text-sm text-slate-900 dark:text-white">{w.name}</h4>

    function StatsView({ data, setData, triggerToast }) {
      const [bedtime, setBedtime] = useState(data.sleep.bedtime || '23:00');
      const [wakeTime, setWakeTime] = useState(data.sleep.wakeTime || '07:00');
      const [quality, setQuality] = useState(data.sleep.quality || 0);
      const [weightInput, setWeightInput] = useState(data.bodyStats.weight ? data.bodyStats.weight.toString() : '');
      const [fatInput, setFatInput] = useState(data.bodyStats.bodyFat ? data.bodyStats.bodyFat.toString() : '');

      const handleSaveSleep = () => {
        playSound('pop');
        const [bh, bm] = bedtime.split(':').map(Number);
        const [wh, wm] = wakeTime.split(':').map(Number);
        let durationHrs = (wh + wm / 60) - (bh + bm / 60);
        if (durationHrs < 0) durationHrs += 24;

        const dateStr = new Date().toISOString().split('T')[0];
        const newHistory = [...data.sleep.history.filter(h => h.date !== dateStr), { date: dateStr, duration: parseFloat(durationHrs.toFixed(1)) }];

        setData(prev => ({
          ...prev,
          sleep: {
            ...prev.sleep,
            bedtime,
            wakeTime,
            quality: quality || 3,
            duration: durationHrs.toFixed(1),
            history: newHistory
          }
        }));
        triggerToast('Sleep metrics updated!');
      };

      const handleSaveBody = () => {
        playSound('success');
        const w = parseFloat(weightInput) || 0;
        const f = parseFloat(fatInput) || 0;

        const newEntry = { date: new Date().toISOString().split('T')[0], weight: w, bodyFat: f };

        setData(prev => ({
          ...prev,
          bodyStats: {
            ...prev.bodyStats,
            weight: w,
            bodyFat: f,
            history: [...prev.bodyStats.history, newEntry]
          }
        }));
        triggerToast('Body measurements recorded!');
      };

      return (
        <div class="space-y-4">
          
          <div class="grid grid-cols-2 gap-3">
            <div class="p-4 rounded-3xl bg-white dark:bg-slate-800/60 border border-slate-200/80 dark:border-slate-800 shadow-sm">
              <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Current Weight</span>
              <p class="text-2xl font-black mt-1 text-slate-900 dark:text-white">
                {data.bodyStats.weight || '--'} <span class="text-xs font-normal text-slate-400">kg</span>
              </p>
              <div class="mt-2 text-[10px] text-emerald-500 font-bold">
                Goal: {data.bodyStats.weightGoal ? `${data.bodyStats.weightGoal} kg` : 'Not set'}
              </div>
            </div>

            <div class="p-4 rounded-3xl bg-white dark:bg-slate-800/60 border border-slate-200/80 dark:border-slate-800 shadow-sm">
              <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Body Fat %</span>
              <p class="text-2xl font-black mt-1 text-slate-900 dark:text-white">
                {data.bodyStats.bodyFat || '--'} <span class="text-xs font-normal text-slate-400">%</span>
              </p>
              <div class="mt-2 text-[10px] text-slate-400 font-medium">
                Waist: {data.bodyStats.waist ? `${data.bodyStats.waist} cm` : 'Not set'}
              </div>
            </div>
          </div>

          <div class="p-4 rounded-3xl bg-white dark:bg-slate-800/40 border border-slate-200/80 dark:border-slate-800 space-y-3 shadow-sm">
            <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Record Body Metrics</h4>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <span class="text-[10px] font-bold text-slate-400">Weight (kg)</span>
                <input 
                  type="number" 
                  placeholder="e.g. 70.0"
                  value={weightInput} 
                  onChange={e => setWeightInput(e.target.value)} 
                  class="w-full mt-1 p-2.5 rounded-xl bg-slate-100 dark:bg-slate-700/50 text-xs font-bold text-slate-900 dark:text-slate-100"
                />
              </div>
              <div>
                <span class="text-[10px] font-bold text-slate-400">Body Fat %</span>
                <input 
                  type="number" 
                  placeholder="e.g. 15.0"
                  value={fatInput} 
                  onChange={e => setFatInput(e.target.value)} 
                  class="w-full mt-1 p-2.5 rounded-xl bg-slate-100 dark:bg-slate-700/50 text-xs font-bold text-slate-900 dark:text-slate-100"
                />
              </div>
            </div>
            <button onClick={handleSaveBody} class="w-full py-2.5 bg-blue-500 hover:bg-blue-600 text-white rounded-xl text-xs font-bold transition-all shadow-md shadow-blue-500/20">
              Update Weight & Body Fat
            </button>
          </div>

          <div class="p-4 rounded-3xl bg-white dark:bg-slate-800/40 border border-slate-200/80 dark:border-slate-800 space-y-3 shadow-sm">
            <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1">
              <Icon name="moon" classNames="w-4 h-4 text-indigo-400" /> Sleep Duration Calculator
            </h4>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <span class="text-[10px] font-bold text-slate-400">Bedtime</span>
                <input 
                  type="time" 
                  value={bedtime} 
                  onChange={e => setBedtime(e.target.value)}
                  class="w-full mt-1 p-2.5 rounded-xl bg-slate-100 dark:bg-slate-700/50 text-xs font-bold text-slate-900 dark:text-slate-100"
                />
              </div>
              <div>
                <span class="text-[10px] font-bold text-slate-400">Wake Up</span>
                <input 
                  type="time" 
                  value={wakeTime} 
                  onChange={e => setWakeTime(e.target.value)}
                  class="w-full mt-1 p-2.5 rounded-xl bg-slate-100 dark:bg-slate-700/50 text-xs font-bold text-slate-900 dark:text-slate-100"
                />
              </div>
            </div>

            <div>
              <span class="text-[10px] font-bold text-slate-400">Sleep Quality Rating</span>
              <div class="flex gap-2 mt-1">
                {[1, 2, 3, 4, 5].map(star => (
                  <button 
                    key={star} 
                    onClick={() => setQuality(star)}
                    class={`flex-1 py-1.5 rounded-xl text-sm font-bold border transition-all ${
                      quality >= star ? 'bg-amber-500/10 border-amber-500/40 text-amber-500' : 'bg-slate-100 dark:bg-slate-700/30 border-transparent text-slate-400'
                    }`}
                  >
                    ★
                  </button>
                ))}
              </div>
            </div>

            <button onClick={handleSaveSleep} class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold transition-all shadow-md shadow-indigo-600/20">
              Calculate & Save Sleep
            </button>
          </div>

          <div class="p-4 rounded-3xl bg-white dark:bg-slate-800/40 border border-slate-200/80 dark:border-slate-800 space-y-3 shadow-sm">
            <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider">7-Day Sleep Duration Trend</h4>
            
            {data.sleep.history.length === 0 ? (
              <div class="py-8 text-center text-slate-400 text-xs font-medium">
                No sleep records logged yet. Calculate & save sleep above to start tracking trends!
              </div>
            ) : (
              <div class="h-32 flex items-end justify-between gap-2 pt-4 px-2 border-b border-slate-100 dark:border-slate-700/60 pb-2">
                {data.sleep.history.map((item, idx) => {
                  const heightPercent = Math.min(100, (item.duration / 10) * 100);
                  return (
                    <div key={idx} class="flex-1 flex flex-col items-center gap-1 group">
                      <span class="text-[9px] font-bold text-slate-400 opacity-0 group-hover:opacity-100 transition-opacity">{item.duration}h</span>
                      <div class="w-full bg-slate-100 dark:bg-slate-700 rounded-t-lg h-24 flex items-end overflow-hidden">
                        <div 
                          class="w-full bg-indigo-500 rounded-t-lg transition-all duration-500" 
                          style={{ height: `${heightPercent}%` }}
                        />
                      </div>
                      <span class="text-[9px] font-medium text-slate-400">{item.date.split(' ')[1] || item.date}</span>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

        </div>
      );
    }

        if (!newTitle.trim()) return;
        playSound('pop');
        const xpVal = parseInt(newXp) || 50;

        const newC = {
          id: 'c_' + Date.now(),
          title: newTitle.trim(),
          xp: xpVal,
          done: false,
          category: 'daily'
        };

        setData(prev => ({
          ...prev,
          challenges: [...prev.challenges, newC]
        }));

        setNewTitle('');
        setShowAddModal(false);
        triggerToast('Custom goal created!');
      };

      const filtered = data.challenges.filter(c => filter === 'all' || c.category === filter);

      return (
        <div class="space-y-4">
          
          <div class={`p-5 rounded-3xl bg-gradient-to-r ${levelInfo.color} text-white shadow-lg flex justify-between items-center`}>

              + Custom Goal
            </button>

                  filter === cat ? 'bg-blue-500 text-white' : 'bg-slate-200/60 dark:bg-slate-800 text-slate-600 dark:text-slate-400'

              >
                {cat}
              </button>
            ))}

          <div class="space-y-2.5">

                      {c.title}
                    </p>
                    <span class="text-[9px] uppercase font-bold text-slate-400">{c.category}</span>
                  </div>
                </div>
                <span class="text-xs font-black text-amber-500 bg-amber-500/10 px-2.5 py-1 rounded-full border border-amber-500/20">
                  +{c.xp} XP
                </span>
              </div>
            ))}

          {showAddModal && (
            <div class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div class="bg-white dark:bg-slate-800 rounded-3xl p-5 w-full max-w-sm space-y-4 shadow-2xl border border-slate-200 dark:border-slate-700">

                    type="text" 
                    placeholder="e.g. Read 15 pages" 
                    value={newTitle} 
                    onChange={e => setNewTitle(e.target.value)}
                    class="w-full mt-1 p-2.5 rounded-xl bg-slate-100 dark:bg-slate-700/50 text-xs font-medium"
                  />
                </div>
                <div>
                  <span class="text-[10px] font-bold text-slate-400">XP Reward</span>
                  <input 
                    type="number" 
                    value={newXp} 
                    onChange={e => setNewXp(e.target.value)}
                    class="w-full mt-1 p-2.5 rounded-xl bg-slate-100 dark:bg-slate-700/50 text-xs font-bold"
                  />
                </div>
                <div class="flex gap-2 pt-2">
                  <button onClick={() => setShowAddModal(false)} class="flex-1 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-700 text-xs font-bold">Cancel</button>

            {cat === 'length' && (
              <>
                <div class="p-3.5 rounded-2xl bg-white dark:bg-slate-800/40 border border-slate-200/80 dark:border-slate-800 flex justify-between items-center"><span class="text-xs font-bold text-slate-500">Inches (in)</span><span class="font-black text-sm text-blue-500">{(val * 39.3701).toFixed(1)} in</span></div>
                <div class="p-3.5 rounded-2xl bg-white dark:bg-slate-800/40 border border-slate-200/80 dark:border-slate-800 flex justify-between items-center"><span class="text-xs font-bold text-slate-500">Feet (ft)</span><span class="font-black text-sm text-blue-500">{(val * 3.28084).toFixed(2)} ft</span></div>
                <div class="p-3.5 rounded-2xl bg-white dark:bg-slate-800/40 border border-slate-200/80 dark:border-slate-800 flex justify-between items-center"><span class="text-xs font-bold text-slate-500">Centimeters (cm)</span><span class="font-black text-sm text-blue-500">{(val * 100).toFixed(1)} cm</span></div>
              </>
            )}
            {cat === 'weight' && (
              <>
                <div class="p-3.5 rounded-2xl bg-white dark:bg-slate-800/40 border border-slate-200/80 dark:border-slate-800 flex justify-between items-center"><span class="text-xs font-bold text-slate-500">Pounds (lbs)</span><span class="font-black text-sm text-blue-500">{(val * 2.20462).toFixed(2)} lbs</span></div>
                <div class="p-3.5 rounded-2xl bg-white dark:bg-slate-800/40 border border-slate-200/80 dark:border-slate-800 flex justify-between items-center"><span class="text-xs font-bold text-slate-500">Ounces (oz)</span><span class="font-black text-sm text-blue-500">{(val * 35.274).toFixed(1)} oz</span></div>
                <div class="p-3.5 rounded-2xl bg-white dark:bg-slate-800/40 border border-slate-200/80 dark:border-slate-800 flex justify-between items-center"><span class="text-xs font-bold text-slate-500">Grams (g)</span><span class="font-black text-sm text-blue-500">{(val * 1000).toFixed(0)} g</span></div>
              </>
            )}
            {cat === 'temp' && (
              <>
                <div class="p-3.5 rounded-2xl bg-white dark:bg-slate-800/40 border border-slate-200/80 dark:border-slate-800 flex justify-between items-center"><span class="text-xs font-bold text-slate-500">Fahrenheit (°F)</span><span class="font-black text-sm text-blue-500">{((val * 9/5) + 32).toFixed(1)} °F</span></div>
                <div class="p-3.5 rounded-2xl bg-white dark:bg-slate-800/40 border border-slate-200/80 dark:border-slate-800 flex justify-between items-center"><span class="text-xs font-bold text-slate-500">Kelvin (K)</span><span class="font-black text-sm text-blue-500">{(val + 273.15).toFixed(1)} K</span></div>
              </>
            )}
          </div>
        </div>
      );
    }

    function CalendarView({ data, setData, onBack, triggerToast }) {
      const [selectedDay, setSelectedDay] = useState(7);
      const [noteText, setNoteText] = useState('');
      const [selectedMood, setSelectedMood] = useState('😊');

      const fullDateStr = `2026-10-${selectedDay < 10 ? '0' + selectedDay : selectedDay}`;

      useEffect(() => {
        const existing = data.dailyNotes[fullDateStr];
        if (existing) {
          setNoteText(existing.text || '');
          setSelectedMood(existing.mood || '😊');
        } else {
          setNoteText('');
        }
      }, [selectedDay]);

      const handleSaveNote = () => {
        playSound('success');
        setData(prev => ({
          ...prev,
          dailyNotes: {
            ...prev.dailyNotes,
            [fullDateStr]: { text: noteText, mood: selectedMood }
          }
        }));
        triggerToast('Daily note saved!');
      };

      return (
        <div class="space-y-4">
          <button onClick={onBack} class="text-xs font-bold text-blue-500 flex items-center gap-1">
            <Icon name="arrowLeft" classNames="w-4 h-4" /> Back to Hub
          </button>

          <div class="p-4 rounded-3xl bg-white dark:bg-slate-800/40 border border-slate-200/80 dark:border-slate-800 space-y-3 shadow-sm">
            <div class="flex justify-between items-center px-1">
              <span class="text-xs font-bold text-slate-900 dark:text-white">October 2026</span>
              <span class="text-[10px] text-slate-400 font-bold">31 Days</span>
            </div>

            <div class="grid grid-cols-7 gap-1 text-center text-xs">
              {['S','M','T','W','T','F','S'].map((d, i) => (
                <span key={i} class="text-slate-400 font-bold text-[10px] py-1">{d}</span>
              ))}
              {Array.from({ length: 31 }).map((_, i) => {
                const dayNum = i + 1;
                const dStr = `2026-10-${dayNum < 10 ? '0' + dayNum : dayNum}`;
                const hasNote = Boolean(data.dailyNotes[dStr]);
                const isSelected = selectedDay === dayNum;

                return (
                  <button 
                    key={i} 
                    onClick={() => setSelectedDay(dayNum)}
                    class={`py-2 rounded-xl text-xs font-bold relative transition-all ${
                      isSelected ? 'bg-blue-500 text-white shadow-md shadow-blue-500/30 scale-105' : 'bg-slate-100 dark:bg-slate-700/30 text-slate-700 dark:text-slate-300'
                    }`}
                  >
                    {dayNum}
                    {hasNote && <span class="absolute bottom-1 left-1/2 -translate-x-1/2 w-1 h-1 bg-amber-400 rounded-full"></span>}
                  </button>
                );
              })}
            </div>
          </div>

          <div class="p-4 rounded-3xl bg-white dark:bg-slate-800/40 border border-slate-200/80 dark:border-slate-800 space-y-3 shadow-sm">
            <div class="flex justify-between items-center">
              <span class="text-xs font-bold text-slate-400 uppercase">Journal Entry for Oct {selectedDay}, 2026</span>
              <div class="flex gap-1">
                {['😊', '⚡', '😐', '😔', '🔥'].map(m => (
                  <button 
                    key={m} 
                    onClick={() => setSelectedMood(m)} 
                    class={`p-1 rounded-lg text-xs ${selectedMood === m ? 'bg-blue-500/20 border border-blue-500/50' : 'opacity-60'}`}
                  >
                    {m}
                  </button>
                ))}
              </div>
            </div>

            <textarea 
              rows="3" 
              placeholder="Record your thoughts or events for this day..."
              value={noteText}
              onChange={e => setNoteText(e.target.value)}
              class="w-full p-3 rounded-2xl bg-slate-100 dark:bg-slate-700/50 text-xs font-medium border-none text-slate-900 dark:text-slate-100 resize-none"
            />

            <button onClick={handleSaveNote} class="w-full py-2.5 bg-blue-500 text-white rounded-xl text-xs font-bold shadow-md shadow-blue-500/20">
              Save Note for Oct {selectedDay}
            </button>
          </div>

        </div>
      );
    }

    function AchievementsView({ data, onClaimAchievement, onBack }) {
      const [tab, setTab] = useState('all');

      const filteredAchievements = data.achievements.filter(a => {
        if (tab === 'claimable') return a.unlocked && !a.claimed;
        if (tab === 'unlocked') return a.claimed;
        if (tab === 'in_progress') return !a.unlocked;
        return true;
      });

      return (
        <div class="space-y-4">
          <button onClick={onBack} class="text-xs font-bold text-blue-500 flex items-center gap-1">
            <Icon name="arrowLeft" classNames="w-4 h-4" /> Back to Hub
          </button>

          <div class="flex gap-2 border-b border-slate-200 dark:border-slate-800 pb-2">
            {[
              { id: 'all', label: 'All' },
              { id: 'claimable', label: 'Claimable' },
              { id: 'in_progress', label: 'In Progress' },
              { id: 'unlocked', label: 'Completed' }
            ].map(t => (
              <button 
                key={t.id} 
                onClick={() => setTab(t.id)}
                class={`px-3 py-1.5 rounded-xl text-xs font-bold capitalize transition-all ${
                  tab === t.id ? 'bg-amber-500 text-white' : 'bg-slate-200/60 dark:bg-slate-800 text-slate-600 dark:text-slate-400'
                }`}
              >
                {t.label}
              </button>
            ))}
          </div>

          <div class="space-y-3">
            {filteredAchievements.map(a => {
              const currentVal = a.current || 0;
              const targetVal = a.target || 1;
              const pct = Math.min(100, Math.round((currentVal / targetVal) * 100));

              return (
                <div 
                  key={a.id} 
                  class={`p-4 rounded-3xl border flex flex-col gap-3 transition-all ${
                    a.claimed 
                      ? 'bg-white dark:bg-slate-800/60 border-slate-200 dark:border-slate-800 opacity-70' 
                      : a.unlocked 
                      ? 'bg-gradient-to-r from-amber-500/10 to-orange-500/10 border-amber-500 shadow-md shadow-amber-500/10' 
                      : 'bg-slate-100/50 dark:bg-slate-900/40 border-slate-200 dark:border-slate-800'
                  }`}
                >
                  <div class="flex items-center gap-3.5">
                    <div class={`w-12 h-12 rounded-2xl flex items-center justify-center text-2xl shadow-sm ${
                      a.unlocked ? 'bg-amber-500 text-white' : 'bg-slate-200 dark:bg-slate-800'
                    }`}>
                      {a.icon}
                    </div>

                    <div class="flex-1">
                      <div class="flex justify-between items-center">
                        <h4 class="font-bold text-sm text-slate-900 dark:text-white">{a.title}</h4>
                        <span class="text-[9px] font-bold uppercase tracking-wider text-amber-500 bg-amber-500/10 px-2 py-0.5 rounded-full">
                          +{a.rewardXp} XP
                        </span>
                      </div>
                      <p class="text-xs text-slate-400 mt-0.5">{a.desc}</p>
                    </div>
                  </div>

                  {/* Progress Bar */}
                  <div class="space-y-1">
                    <div class="flex justify-between text-[10px] text-slate-400 font-bold">
                      <span>Progress</span>
                      <span>{currentVal.toLocaleString()} / {targetVal.toLocaleString()} ({pct}%)</span>
                    </div>
                    <div class="w-full h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden">
                      <div class="h-full bg-amber-500 rounded-full transition-all duration-300" style={{ width: `${pct}%` }} />
                    </div>
                  </div>

                  {/* Claim Button */}
                  {a.unlocked && !a.claimed && (
                    <button 
                      onClick={() => onClaimAchievement(a.id)}
                      class="w-full py-2.5 bg-gradient-to-r from-amber-500 to-orange-500 text-white font-black text-xs rounded-2xl shadow-md shadow-amber-500/20 active:scale-95 transition-all"
                    >
                      🎁 Claim +{a.rewardXp} XP Reward
                    </button>
                  )}

                  {a.claimed && (
                    <div class="text-[10px] text-emerald-500 font-extrabold flex items-center justify-end gap-1">
                      <span>✓ Completed & Claimed</span>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function SettingsView({ data, setData, onBack, onOpenReset, triggerToast }) {
      const [waterGoal, setWaterGoal] = useState(data.waterTarget.toString());
      const fileInputRef = useRef(null);

      const handleSaveSettings = () => {
        playSound('success');
        const g = parseInt(waterGoal) || 8;
        setData(prev => ({
          ...prev,
          waterTarget: g
        }));
        triggerToast('Settings updated!');
      };

      const handleExportData = () => {
        playSound('pop');
        const str = JSON.stringify(data, null, 2);
        const blob = new Blob([str], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `everyday_pwa_backup_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        triggerToast('Backup JSON downloaded!');
      };

      const handleImportData = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const parsed = JSON.parse(evt.target.result);
            if (parsed && typeof parsed === 'object' && parsed.xp !== undefined) {
              setData(parsed);
              playSound('success');
              triggerToast('Data restored from JSON file!');
            } else {
              triggerToast('Invalid JSON backup file structure.');
            }
          } catch (err) {
            triggerToast('Failed to parse backup JSON file.');
          }
        };
        reader.readAsText(file);
      };

      return (
        <div class="space-y-4">
          <button onClick={onBack} class="text-xs font-bold text-blue-500 flex items-center gap-1">
            <Icon name="arrowLeft" classNames="w-4 h-4" /> Back to Hub
          </button>

          <div class="p-4 rounded-3xl bg-white dark:bg-slate-800/40 border border-slate-200/80 dark:border-slate-800 space-y-3 shadow-sm">
            <h4 class="text-xs font-bold text-slate-400 uppercase">Daily Hydration Target</h4>
            <div class="flex items-center gap-3">
              <input 
                type="number" 
                value={waterGoal} 
                onChange={e => setWaterGoal(e.target.value)}
                class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-700/50 text-xs font-bold w-24 text-center"
              />
              <span class="text-xs font-semibold text-slate-500">Glasses / Day</span>
            </div>
            <button onClick={handleSaveSettings} class="w-full py-2.5 bg-blue-500 text-white rounded-xl text-xs font-bold hover:bg-blue-600 transition-all">Save Preferences</button>
          </div>

          <div class="p-4 rounded-3xl bg-white dark:bg-slate-800/40 border border-slate-200/80 dark:border-slate-800 space-y-3 shadow-sm">
            <h4 class="text-xs font-bold text-slate-400 uppercase">Data Backup & Restore</h4>
            <div class="flex gap-2">
              <button onClick={handleExportData} class="flex-1 py-2.5 bg-slate-800 dark:bg-slate-700 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-1">
                <span>📥</span> Export JSON
              </button>
              <button onClick={() => fileInputRef.current && fileInputRef.current.click()} class="flex-1 py-2.5 bg-slate-100 dark:bg-slate-700 text-slate-800 dark:text-slate-100 rounded-xl text-xs font-bold flex items-center justify-center gap-1">
                <span>📤</span> Import JSON
              </button>
              <input type="file" ref={fileInputRef} onChange={handleImportData} accept=".json" class="hidden" />
            </div>
          </div>

          {/* Explicit Reset Zone */}
          <div class="p-4 rounded-3xl bg-red-500/10 border border-red-500/20 space-y-2">
            <h4 class="text-xs font-bold text-red-500 uppercase">Danger Zone</h4>
            <button 
              onClick={onOpenReset} 
              class="w-full py-3 bg-red-500 hover:bg-red-600 active:scale-95 text-white rounded-2xl text-xs font-black shadow-md shadow-red-500/20 transition-all flex items-center justify-center gap-2"
            >
              <span>⚠️</span> Factory Reset App to Zero
            </button>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
